name: Payment Health Check

on:
  schedule:
    - cron: "0 * * * *"  # כל שעה
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.summary.outputs.issue }}
      reason: ${{ steps.summary.outputs.reason }}

    steps:
      - name: Test CORS preflight
        id: cors
        run: |
          HEADERS=$(curl -sI --max-time 15 \
            -X OPTIONS \
            "$SUPABASE_URL/functions/v1/create-checkout" \
            -H "Origin: https://haimetkin-lgtm.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: x-client-info, content-type, authorization")
          echo "$HEADERS"
          if echo "$HEADERS" | grep -qi "x-client-info"; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Check failed payment_orders (last 2h)
        id: db
        run: |
          RESULT=$(curl -s --max-time 15 \
            "$SUPABASE_URL/rest/v1/payment_orders?select=id,status,created_at&status=in.(\"checkout_failed\",\"error\")&created_at=gte.$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')&limit=10" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          COUNT=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Summarize issues
        id: summary
        run: |
          ISSUE="false"
          REASON=""
          if [ "${{ steps.cors.outputs.ok }}" = "false" ]; then
            ISSUE="true"
            REASON="CORS שבור - תשלומים לא יכולים להתחיל"
          fi
          if [ "${{ steps.db.outputs.count }}" -gt "2" ] 2>/dev/null; then
            ISSUE="true"
            REASON="$REASON | ${{ steps.db.outputs.count }} תשלומים נכשלו ב-2 שעות"
          fi
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT

      - name: Send WhatsApp alert
        if: steps.summary.outputs.issue == 'true'
        run: |
          curl -s -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json" \
            -u "$TWILIO_SID:$TWILIO_TOKEN" \
            --data-urlencode "From=whatsapp:$TWILIO_WHATSAPP_NUMBER" \
            --data-urlencode "To=whatsapp:+972523728828" \
            --data-urlencode "Body=⚠️ *PriceVsValue - תקלת תשלום*

סיבה: ${{ steps.summary.outputs.reason }}

לתיקון מיידי:
https://github.com/haimetkin-lgtm/price-vs-value/actions/workflows/auto-fix.yml

לוגים:
https://supabase.com/dashboard/project/caxislqmvamkpeaadhnt/logs/edge-functions"
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}

      - name: Fail job if issue found (sends GitHub email too)
        if: steps.summary.outputs.issue == 'true'
        run: exit 1
